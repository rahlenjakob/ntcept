name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race is the point of this job: the capture store, the hold queue and the certificate
      # cache are all written by one goroutine per connection and read by the control plane.
      - name: go test -race
        run: go test -race -count=1 -timeout 15m ./...

  # The Linux tunnel attach has never run in CI, and it is the half that has produced the real
  # bugs. This job exists to run it, and fails rather than skips if it cannot — a tunnel job that
  # quietly skips instead of running is worse than no job at all.
  tunnel-linux:
    name: tunnel attach (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: provide /dev/net/tun
        run: |
          sudo modprobe tun || true
          ls -l /dev/net/tun

      # Ubuntu 24.04 runners ship kernel.apparmor_restrict_unprivileged_userns=1, which lets a
      # userns be created but strips CAP_NET_ADMIN inside it, so TUNSETIFF fails with EPERM. This
      # job exists to exercise the rootless tunnel as it runs on a permissive kernel, so relax the
      # restriction here rather than fall back to sudo.
      - name: allow unprivileged user namespaces (rootless tunnel)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true

      - name: unprivileged user namespaces are available
        run: |
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          cat /proc/sys/user/max_user_namespaces

      - name: build
        run: go build -o /tmp/ntcept ./cmd/ntcept

      # A rule or a namespace that is merely set up is not one that routes. doctor measures.
      - name: doctor reports the tunnel attach as available
        run: |
          /tmp/ntcept doctor --json > /tmp/doctor.json || true
          cat /tmp/doctor.json
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("/tmp/doctor.json"))
          for c in doc["checks"]:
              if c["name"].startswith("tunnel attach"):
                  if not c["ok"]:
                      sys.exit(f"tunnel attach unavailable: {c.get('detail')}")
                  print("tunnel attach available:", c["name"])
                  break
          else:
              sys.exit("doctor did not report on the tunnel attach at all")
          PY

      - name: end to end, through the tunnel
        env:
          NTCEPT_E2E_REQUIRE_TUNNEL: "1"
          # Loopback interception relies on the host routing 127/8 over the link, which hosted
          # runners restrict; those tests are covered by running e2e locally, not here.
          NTCEPT_E2E_SKIP_LOOPBACK: "1"
        run: go test -count=1 -timeout 15m -v ./internal/e2e/

      - name: the interception engine
        run: go test -race -count=1 -timeout 15m ./internal/tunnel/ ./internal/netns/

  # The macOS attach is the one that has produced every platform-specific bug in this repo, and
  # it is the one that cannot be exercised anywhere else: pfctl's rule semantics, the utun
  # control socket and the sudoers grant have no Linux equivalent to stand in for them. The
  # runner has passwordless sudo and is thrown away afterwards, so the real one-time setup runs
  # here exactly as it would on a user's machine.
  tunnel-macos:
    name: tunnel attach (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o /tmp/ntcept ./cmd/ntcept

      - name: one-time privileged setup
        run: sudo /tmp/ntcept install

      # `pfctl -nf` accepting a rule is not the same as pf routing with it — that distinction
      # has already cost this project one silent failure, so the check is what doctor measures.
      - name: doctor reports the tunnel attach as available
        run: |
          /tmp/ntcept doctor --json > /tmp/doctor.json || true
          cat /tmp/doctor.json
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("/tmp/doctor.json"))
          checks = {c["name"]: c for c in doc["checks"]}
          for name, c in checks.items():
              if name.startswith("tunnel attach") and not c["ok"]:
                  sys.exit(f"tunnel attach unavailable: {c.get('detail')}")
          if not checks.get("one-time setup done", {}).get("ok"):
              sys.exit("`ntcept install` ran but the grant is not in effect")
          print("pf attach available, setup in effect")
          PY

      - name: end to end, through pf and the utun
        env:
          NTCEPT_E2E_REQUIRE_TUNNEL: "1"
        run: go test -count=1 -timeout 15m -v ./internal/e2e/

      # Loopback interception (an app reaching a service on 127.0.0.1 while ntcept captures it) is
      # validated locally, not on hosted runners: their network stack restricts the loopback
      # diversion this relies on, so it times out here even though it works on a real machine.
      # Run it for signal, but do not gate CI on it.
      - name: localhost capture (informational — not reliable on hosted runners)
        run: |
          echo "Loopback capture is covered locally; on hosted runners it is informational only."
          python3 -m http.server 18099 --bind 127.0.0.1 &
          sleep 2
          set +e
          code=$(/tmp/ntcept run --quiet -- \
            curl -sS --max-time 20 -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/ 2>/tmp/curl.err)
          set -e
          echo "localhost returned '${code}' (informational; not gating CI)"
          cat /tmp/curl.err || true

      - name: setup is reversible
        run: |
          sudo /tmp/ntcept uninstall
          test ! -f /usr/local/libexec/ntcept-helper
          test ! -f /etc/sudoers.d/ntcept

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/ntcept-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ntcept

      - uses: actions/upload-artifact@v4
        with:
          name: ntcept-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # Benchmarks are not a pass/fail gate — the runners are too noisy for that — but they must keep
  # compiling and running, and the numbers are worth having in the log when something gets slow.
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: network path
        run: |
          go test -run '^$' -bench . -benchtime 10x -timeout 20m \
            ./internal/proxy/ ./internal/tunnel/ ./internal/redact/ \
            | tee /tmp/bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: /tmp/bench.txt
